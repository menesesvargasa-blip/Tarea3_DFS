<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster Pro - API REST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-list-check text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">TaskMaster Pro</h1>
      </div>
      <div id="userHeaderInfo" class="hidden flex items-center space-x-4">
        <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full border border-indigo-500 flex items-center gap-2">
          <i class="fa-solid fa-user text-xs"></i>
          <span id="headerUsername" class="font-medium">Usuario</span>
        </span>
        <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 text-white font-semibold py-1.5 px-3 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-4 flex-grow flex flex-col justify-center">

    <!-- AUTENTICACIÓN -->
    <div id="authSection" class="w-full max-w-md mx-auto my-8">
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="flex border-b border-gray-100 bg-gray-50/50">
          <button id="tabLogin" class="w-1/2 py-3.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Iniciar Sesión</button>
          <button id="tabRegister" class="w-1/2 py-3.5 text-center font-semibold text-gray-400 border-b-2 border-transparent transition">Registrarse</button>
        </div>

        <div class="p-6">
          <div id="authMessage" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Usuario</label>
              <input type="text" id="loginUsername" required placeholder="tu usuario" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Contraseña</label>
              <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition">Ingresar</button>
          </form>

          <form id="registerForm" class="space-y-4 hidden">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Usuario</label>
              <input type="text" id="regUsername" required placeholder="nuevo usuario" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Contraseña</label>
              <input type="password" id="regPassword" required placeholder="contraseña" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Confirmar Contraseña</label>
              <input type="password" id="regPasswordConfirm" required placeholder="repite contraseña" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition">Crear Cuenta</button>
          </form>
        </div>
      </div>
    </div>

    <!-- SECCIÓN DE TAREAS -->
    <div id="todoSection" class="hidden space-y-6 my-4">
      <div class="bg-white p-5 rounded-2xl shadow-md border border-gray-100">
        <h2 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-plus text-indigo-500"></i> Nueva Tarea
        </h2>
        <form id="taskForm" class="flex flex-col gap-3">
          <input type="text" id="taskTitle" placeholder="Título de la tarea" required class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <textarea id="taskDesc" placeholder="Descripción detallada de la tarea" rows="2" required class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
          
          <div class="flex gap-3">
            <select id="taskPriority" class="flex-grow px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="baja">Prioridad Baja</option>
              <option value="media" selected>Prioridad Media</option>
              <option value="alta">Prioridad Alta</option>
            </select>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg shadow transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus"></i> Guardar Tarea
            </button>
          </div>
        </form>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
        <div class="flex space-x-2">
          <button data-filter="all" class="filter-btn active text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600">Todas</button>
          <button data-filter="pending" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100">Pendientes</button>
          <button data-filter="completed" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100">Completadas</button>
        </div>
        <div class="text-xs text-gray-500 font-medium"><span id="taskCount">0</span> tareas</div>
      </div>

      <div id="taskList" class="space-y-2"></div>
      
      <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200">
        <i class="fa-solid fa-clipboard-check text-4xl text-gray-300 mb-2"></i>
        <p class="text-gray-500 font-medium">No hay tareas registradas</p>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-200 mt-auto bg-white">
    TaskMaster Pro &copy; 2026
  </footer>

  <script src="app.js"></script>
</body>
</html>
