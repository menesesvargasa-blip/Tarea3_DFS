<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-list-check text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">TaskMaster Pro</h1>
      </div>
      <div id="userHeaderInfo" class="hidden flex items-center space-x-4">
        <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full border border-indigo-500 flex items-center gap-2">
          <i class="fa-solid fa-user text-xs"></i>
          <span id="headerUsername" class="font-medium">Usuario</span>
        </span>
        <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 text-white font-semibold py-1.5 px-3 rounded-lg transition duration-200 shadow hover:shadow-md flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow flex flex-col justify-center">

    <!-- SECCIÓN DE AUTENTICACIÓN -->
    <div id="authSection" class="w-full max-w-md mx-auto my-8">
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Tabs de login / registro -->
        <div class="flex border-b border-gray-100 bg-gray-50/50">
          <button id="tabLogin" class="w-1/2 py-3.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">
            Iniciar Sesión
          </button>
          <button id="tabRegister" class="w-1/2 py-3.5 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition">
            Registrarse
          </button>
        </div>

        <div class="p-6">
          <div id="authMessage" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

          <!-- Formulario Login -->
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nombre de Usuario</label>
              <div class="relative">
                <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="text" id="loginUsername" required placeholder="ej. usuario123" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Contraseña</label>
              <div class="relative">
                <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
              </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200">
              Ingresar
            </button>
          </form>

          <!-- Formulario Registro -->
          <form id="registerForm" class="space-y-4 hidden">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nombre de Usuario</label>
              <div class="relative">
                <i class="fa-solid fa-user-plus absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="text" id="regUsername" required placeholder="Crea un nombre de usuario" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Contraseña</label>
              <div class="relative">
                <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="password" id="regPassword" required placeholder="Crea una contraseña" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Confirmar Contraseña</label>
              <div class="relative">
                <i class="fa-solid fa-check-double absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="password" id="regPasswordConfirm" required placeholder="Repite la contraseña" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
              </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200">
              Crear Cuenta
            </button>
          </form>

          <!-- JSON Sync Zone -->
          <div class="mt-6 pt-4 border-t border-gray-100 flex flex-col gap-2">
            <span class="text-xs text-gray-400 font-medium text-center">Persistencia de datos (.JSON)</span>
            <div class="flex gap-2">
              <button id="exportBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Descargar JSON
              </button>
              <label class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 cursor-pointer transition">
                <i class="fa-solid fa-upload"></i> Cargar JSON
                <input type="file" id="importInput" accept=".json" class="hidden">
              </label>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- SECCIÓN DE APPLICACIÓN DE TAREAS -->
    <div id="todoSection" class="hidden space-y-6 my-4">
      
      <!-- Input de Nueva Tarea -->
      <div class="bg-white p-5 rounded-2xl shadow-md border border-gray-100">
        <h2 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-plus text-indigo-500"></i> Nueva Tarea
        </h2>
        <form id="taskForm" class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="taskTitle" placeholder="¿Qué necesitas hacer hoy?" required class="flex-grow px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
          
          <select id="taskPriority" class="px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            <option value="baja">Prioridad Baja</option>
            <option value="media" selected>Prioridad Media</option>
            <option value="alta">Prioridad Alta</option>
          </select>

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> Añadir
          </button>
        </form>
      </div>

      <!-- Control / Filtros -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap justify-between items-center gap-3">
        
        <div class="flex items-center space-x-1 sm:space-x-2">
          <button data-filter="all" class="filter-btn active text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 transition">Todas</button>
          <button data-filter="pending" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100 transition">Pendientes</button>
          <button data-filter="completed" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100 transition">Completadas</button>
        </div>

        <div class="text-xs text-gray-500 font-medium">
          <span id="taskCount">0</span> tareas guardadas
        </div>
      </div>

      <!-- Lista de Tareas -->
      <div id="taskList" class="space-y-2"></div>
      
      <!-- Estado Vacío -->
      <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200">
        <i class="fa-solid fa-clipboard-check text-4xl text-gray-300 mb-2"></i>
        <p class="text-gray-500 font-medium">No hay tareas en esta sección</p>
        <span class="text-xs text-gray-400">¡Crea una nueva arriba para comenzar!</span>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-200 mt-auto bg-white">
    TaskMaster Pro &copy; Frontend App - Almacenamiento JSON
  </footer>

  <script src="app.js"></script>
</body>
</html>
